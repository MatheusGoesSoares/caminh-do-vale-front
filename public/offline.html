<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#164D38" />
  <title>Caminho do Vale — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #F3F7F1;
      color: #20352D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #E7F2E9;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      color: #328568;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #164D38;
    }
    p {
      font-size: 0.95rem;
      color: #718078;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .hint {
      font-size: 0.85rem;
      color: #A8CDB0;
      padding: 0.75rem 1rem;
      background: white;
      border-radius: 0.5rem;
      border: 1px solid #E7F2E9;
    }
    button {
      background: #164D38;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    button:hover { background: #328568; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M15.536 8.464a5 5 0 010 7.072M6 15h.01M9 12a3 3 0 013-3" />
        <line x1="2" y1="2" x2="22" y2="22" stroke-linecap="round" />
      </svg>
    </div>
    <h1>Sem conexão</h1>
    <p>
      Você está offline no momento. Verifique sua conexão com a internet e tente novamente.
    </p>
    <button onclick="window.location.reload()">Tentar novamente</button>
    <div class="hint">
      Dados armazenados localmente podem estar disponíveis quando você reconectar.
    </div>
  </div>
</body>
</html>
